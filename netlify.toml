# ==============================================================================
# LogicWhileLiRE — Netlify Production Deployment Config
# ==============================================================================

[build]
  base = "client"
  publish = "dist"
  command = "npm run build"

# SPA Fallback: Route all incoming paths to index.html with 200 status
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security and cache headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
